# ==============================================================================
# General Settings
# ==============================================================================

# Start window numbering at 1 instead of 0 — easier to reach on the keyboard
set -g base-index 1

# When a window is closed, re-number the remaining windows sequentially
# so there are no gaps (e.g. 1,2,3 instead of 1,3,4)
set -g renumber-windows on

# How long (ms) pane numbers stay visible after pressing prefix+q.
# 2000ms gives enough time to read and select a pane by number
set -g display-panes-time 2000

# Scrollback buffer size — how many lines of history each pane retains
set -g history-limit 50000

# Eliminate the delay after pressing Escape. Without this, tmux waits to see
# if Escape is part of a longer key sequence, which makes Vim mode-switching
# feel sluggish (see: http://superuser.com/a/252717/65504)
set -s escape-time 0

# Enable mouse support — allows clicking to select panes, dragging to resize
# pane borders, and scrolling through pane history with the mouse wheel
set -g mouse on

# When you kill a session, switch to another session instead of detaching.
# Prevents being dropped out of tmux when closing a session
set -g detach-on-destroy off

# Send focus events to applications inside tmux. Required for Vim's
# 'autoread' to detect when a file changes on disk while you're in another pane
set -g focus-events on

# Enable OSC 52 clipboard integration. Allows tmux to set the system clipboard
# directly, which also works over SSH connections
set -g set-clipboard on

# Resize windows to the smallest client that is *actively viewing* the window,
# rather than the smallest client attached to the entire session. Useful when
# multiple clients have different terminal sizes
setw -g aggressive-resize on

# ==============================================================================
# Terminal & Colours
# ==============================================================================

# Use tmux-256color instead of screen-256color for better feature support
# (e.g. italics, strikethrough). Requires a terminfo entry for tmux-256color
set -g default-terminal 'tmux-256color'

# Enable 24-bit true colour support for terminals that advertise xterm-256color
set -as terminal-features ',xterm-256color:RGB'

# ==============================================================================
# Status Bar
# ==============================================================================

# Use status-style instead of the deprecated status-fg/status-bg options
set -g status-style 'fg=black,bg=green'

# Maximum length of the left status segment before it gets truncated
set -g status-left-length 40

# Left side: show the session name in square brackets
set -g status-left '[#S] '

# Right side: show sync indicator (when panes are synchronised) and date/time.
# Uses tmux's built-in strftime formatting instead of shelling out to `date`
set -g status-right "#{?pane_synchronized,--SYNCED--,} %a, %b %d - %I:%M "

# ==============================================================================
# Vi Copy Mode
# ==============================================================================

# Use vim-style keybindings in copy mode (navigate with h/j/k/l, etc.)
setw -g mode-keys vi

# 'v' starts visual selection (like Vim's visual mode)
bind-key -T copy-mode-vi v send -X begin-selection

# 'y' yanks (copies) the selection to the system clipboard and exits copy mode
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Enter also copies selection to clipboard and exits (matches default terminal behaviour)
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Space repeats the last jump (f/F/t/T) instead of starting selection
# (selection is remapped to 'v' above)
unbind -T copy-mode-vi Space
bind -T copy-mode-vi Space send -X jump-again

# '0' goes to first non-whitespace character (like Vim's ^) instead of column 0
bind-key -T copy-mode-vi 0 send -X back-to-indentation

# prefix+y / prefix+C-y: copy the current tmux buffer to the system clipboard
bind y run 'tmux save-buffer - | pbcopy'
bind C-y run 'tmux save-buffer - | pbcopy'

# ==============================================================================
# Window & Pane Creation
# ==============================================================================

# prefix+c: create a new window, starting in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# prefix+- : split pane horizontally (one above, one below), keeping current directory
# prefix+\ : split pane vertically (side by side), keeping current directory
# These are more intuitive than the defaults (prefix+" and prefix+%)
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# prefix+C-d: open dotfiles directory in Vim with fzf file picker
bind C-d split-window -h -c ~/dotfiles/ "vim +Files"

# prefix+g: open lazygit in a side split for interactive git operations
# (requires: brew install lazygit)
bind g split-window -h -c "#{pane_current_path}" "lazygit"

# prefix+t: show a colour directory tree (3 levels deep) in a side split
# (requires: brew install tree)
bind t split-window -h -c "#{pane_current_path}" "tree -C -L 3 | less -R"

# ==============================================================================
# Session & Pane Management
# ==============================================================================

# prefix+b: break the current pane out into its own background window
# (the -d flag means stay in the current window rather than following it)
bind b break-pane -d

# prefix+!: kill the current session and switch to another one.
# Tries last session first, then next session, then kills tmux entirely
bind-key ! run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'

# prefix+J: pull a pane from another window into the current window as a side split.
# Prompts for the source pane (e.g. "2.1" means window 2, pane 1)
bind-key J command-prompt -p "join pane from: " "join-pane -h -s '%%'"

# prefix+C-j: fuzzy-search tmux sessions with fzf and switch to the selected one.
# Excludes the current session from the list. --exit-0 closes fzf if no matches
bind C-j split-window -v "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse --exit-0 | xargs tmux switch-client -t"

# prefix+Space: toggle between the current and previous session.
# (Overrides the default binding which cycles through preset layouts)
bind-key Space switch-client -l

# ==============================================================================
# Navigation — Vim/Tmux Seamless Pane Switching
# ==============================================================================
# Allows C-h/j/k/l to move between tmux panes AND Vim splits seamlessly.
# When the active pane is running Vim, the key is forwarded to Vim.
# Otherwise, tmux handles the pane switch directly.
# See: http://robots.thoughtbot.com/post/53022241323/seamlessly-navigate-vim-and-tmux-splits

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# prefix+C-l: send a real C-l (clear/redraw) to the terminal, since the bare
# C-l is taken by the vim-tmux navigator above
bind C-l send-keys 'C-l'

# ==============================================================================
# Reload Config
# ==============================================================================

# prefix+C-r: reload this config file and show a confirmation message
bind C-r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ==============================================================================
# Pane Resizing
# ==============================================================================
# Shift+Arrow: fine-grained resize (1-2 cells at a time)
# These are root-table bindings (no prefix needed)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Ctrl+Arrow: coarse resize (5-10 cells at a time) for quick adjustments.
# Note: these override the shell's word-jumping shortcuts (Ctrl+Left/Right)
bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5

# ==============================================================================
# Plugins (managed by TPM — https://github.com/tmux-plugins/tpm)
# ==============================================================================
# Install TPM:  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install plugins: prefix+I    Update plugins: prefix+U

# --- tmux-resurrect ---
# Saves and restores tmux sessions (windows, panes, layouts) across restarts.
# prefix+S saves the current session state, prefix+R restores the last saved state.
# (Rebound from the defaults Ctrl-s/Ctrl-r to avoid conflict with config reload)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# --- tmux-continuum ---
# Automatically saves sessions every 15 minutes (builds on tmux-resurrect).
# Also auto-restores the last saved session when tmux starts.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- tmux-logging ---
# Pane logging and history export tools:
#   prefix+Shift-p       Toggle logging the current pane to a file
#   prefix+Alt-p         Save visible pane contents to a file
#   prefix+Alt-Shift-p   Export full pane history to a file
#   prefix+Alt-c         Clear pane history
# Logs are saved to the home directory as tmux-{session}-{window}-{pane}-{timestamp}.log
set -g @plugin 'tmux-plugins/tmux-logging'

# Initialise TPM (must be the very last line in tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
